<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Safari 地址栏跟着页面实际主题变色（JS 里同步），不是跟系统——
     首次打开固定深色，用户手动切换后这个值也要跟着变，不然地址栏和
     页面对不上 -->
<meta name="theme-color" content="#101820" id="themeColorMeta">
<!-- iOS 添加到主屏幕后全屏运行，没有 Safari 外壳 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="恐慌深度">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png" sizes="32x32">
<link rel="manifest" href="site.webmanifest">
<title>一位比特国王 · 贪婪恐慌深度</title>
<meta name="description" content="十六个全球市场的贪婪恐慌深度。越绿越便宜，越红越贵。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EAEEF1; --card:#F6F8F9; --sunk:#DFE5E9;
  --rule:#C6D0D7; --rule-soft:#D8E0E5;
  --ink:#16242F; --ink2:#3E535F; --ink3:#5A6E7A;
  --crown:#8A620F; --warnbg:#FBF2DC; --warnbd:#8C640C; --warnfg:#5F440A;
  --z1:#2E6B4B; --z2:#1E5C3C; --z3:#124C30; --z4:#05341F;
  --g1:#8E3826; --g2:#7C2C1D; --g3:#6D1E1A; --g4:#5E1019;
  --tipbg:#16242F; --tipfg:#FFFFFF; --tipac:#8FD8B4;
  --ui:"Sora","Noto Sans SC",-apple-system,"PingFang SC",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
html[data-theme="dark"]{
  --paper:#101820; --card:#17222C; --sunk:#1E2A35;
  --rule:#2C3B47; --rule-soft:#243039;
  --ink:#DCE5EA; --ink2:#A3B6C2; --ink3:#7E96A4;
  --crown:#D9A93F; --warnbg:#2E2612; --warnbd:#B98D2A; --warnfg:#E7CB84;
  --z1:#6BD79F; --z2:#55D190; --z3:#42CE84; --z4:#2FE58C;
  --g1:#FF7458; --g2:#FF6A5C; --g3:#FF5F62; --g4:#FF5468;
  --tipbg:#DCE5EA; --tipfg:#101820; --tipac:#1B5D3D;
}
*{box-sizing:border-box}
html{
  -webkit-text-size-adjust:100%;scroll-behavior:smooth;
  -webkit-tap-highlight-color:transparent;      /* 去掉 iOS 点击时的灰块闪烁 */
}
button,a{touch-action:manipulation}             /* 禁掉双击缩放的 300ms 延迟 */
::selection{background:var(--crown);color:#fff}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--ui);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;
  transition:background .2s,color .2s}
.wrap{max-width:1180px;margin:0 auto;
  padding:0 calc(28px + env(safe-area-inset-left)) 0 calc(28px + env(safe-area-inset-right))}

.brand{display:flex;align-items:center;gap:13px;padding:26px 0 0;flex-wrap:wrap}
.crown{width:32px;height:25px;flex-shrink:0}
.crown path{stroke:var(--crown)}
.brand-name{font-weight:800;font-size:21px;letter-spacing:.01em}
.tools{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.pill{
  display:inline-flex;align-items:center;gap:7px;font-family:var(--ui);
  font-size:14.5px;font-weight:600;color:var(--ink2);text-decoration:none;
  border:2px solid var(--rule);border-radius:22px;padding:6px 14px;
  background:var(--card);cursor:pointer;transition:border-color .15s,color .15s;
}
.pill:hover{border-color:var(--ink);color:var(--ink)}
.pill.on{border-color:var(--crown);color:var(--crown)}
.pill svg{width:15px;height:15px;fill:currentColor}
.pill.mono{font-family:var(--mono)}

header{padding:40px 0 34px}
h1{font-weight:800;font-size:clamp(36px,5.4vw,62px);line-height:1.09;
   letter-spacing:-.025em;margin:0}
.scale{margin-top:32px;max-width:580px}
.scale-bar{height:14px;border-radius:7px;border:1px solid var(--rule)}
.scale-ends{display:flex;justify-content:space-between;gap:12px;margin-top:9px;
  font-size:14.5px;font-weight:600}

.composite{margin-top:30px;border:2px solid var(--rule);border-radius:16px;
  background:var(--card);padding:26px 30px;display:flex;align-items:center;
  justify-content:space-between;gap:30px;flex-wrap:wrap}
.composite-main{display:flex;flex-direction:column;gap:7px;min-width:230px}
.composite-label{font-size:15.5px;font-weight:700;color:var(--ink2);letter-spacing:.01em}
.composite-num{font-family:var(--mono);font-weight:800;line-height:1;
  font-size:clamp(52px,8vw,92px);letter-spacing:-.02em}
.composite-meta{font-size:14.5px;color:var(--ink3)}
.composite-spark{flex:1 1 240px;min-width:180px;max-width:420px;height:78px}
.composite-spark svg{width:100%;height:100%;display:block;overflow:visible}
@media (max-width:780px){
  .composite{padding:20px 20px;gap:18px}
  .composite-num{font-size:clamp(44px,13vw,64px)}
}

.notice{margin-top:22px;background:var(--warnbg);border:2px solid var(--warnbd);
  color:var(--warnfg);padding:14px 18px;border-radius:8px;font-size:16.5px;font-weight:500}

/* 吸顶导航：16 个色块，滚到哪儿都能一键跳 */
.navbar{
  position:sticky;top:0;z-index:15;
  background:color-mix(in srgb, var(--paper) 82%, transparent);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  backdrop-filter:saturate(180%) blur(14px);
  border-bottom:2px solid var(--rule);margin:0 -28px;
  padding:11px 28px calc(11px) 28px;display:none;
}
@supports not (backdrop-filter:blur(1px)){.navbar{background:var(--paper)}}
.navbar.show{display:block}
.navstrip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px;
  -webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.navstrip::-webkit-scrollbar{height:5px}
.navstrip::-webkit-scrollbar-thumb{background:var(--rule);border-radius:3px}
.chip{
  flex:0 0 auto;display:flex;align-items:center;gap:7px;text-decoration:none;
  font-family:var(--mono);font-size:13.5px;font-weight:700;color:var(--ink2);
  border:2px solid var(--rule);border-radius:18px;padding:4px 11px 4px 6px;
  background:var(--card);white-space:nowrap;
}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip i{width:11px;height:11px;border-radius:50%;flex-shrink:0}

.band{padding:36px 0 44px;border-top:2px solid var(--rule)}
.band-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
h2{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em}
.summary{font-size:18px;color:var(--ink2);margin:0 0 22px;line-height:1.6;max-width:72ch}
.summary b{font-family:var(--mono);font-weight:700;color:var(--ink)}
#ribbon{width:100%;height:auto;display:block}
#ribbon a{cursor:pointer}
#ribbon a:hover text{opacity:.55;text-decoration:underline}

.panels{padding-bottom:60px}
.band-extra{padding:8px 0 8px;border-top:2px solid var(--rule)}
.band-extra h2{margin-bottom:16px}

.bond-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:22px}
.bond-tile{border:2px solid var(--rule);border-radius:12px;background:var(--card);padding:18px 20px}
.bond-tile .bt-label{font-size:14.5px;font-weight:700;color:var(--ink2);margin-bottom:9px}
.bond-tile .bt-num{font-family:var(--mono);font-weight:800;font-size:34px;line-height:1}
.bond-tile .bt-sub{font-size:14px;color:var(--ink3);margin-top:8px;line-height:1.5}
.bond-tile .bt-sub b{font-family:var(--mono);font-weight:700;color:var(--ink)}

.divergence-box{border:2px solid var(--rule);border-radius:12px;background:var(--card);
  padding:20px 22px;margin-bottom:24px}
.divergence-box .dv-label{font-size:14.5px;font-weight:700;color:var(--ink2);margin-bottom:9px}
.divergence-box .dv-num{font-family:var(--mono);font-weight:800;font-size:34px;line-height:1}
.divergence-box .dv-formula{font-size:14px;color:var(--ink3);margin-top:8px}
.divergence-box .dv-formula b{font-family:var(--mono);font-weight:700;color:var(--ink)}
.divergence-box .dv-episodes{font-size:14.5px;color:var(--ink2);margin-top:14px;
  padding-top:14px;border-top:1px solid var(--rule-soft);line-height:1.7}
.divergence-box .dv-episodes b{font-family:var(--mono);font-weight:700;color:var(--ink)}

.yield-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:28px}
.yield-tile{border:2px solid var(--rule);border-radius:10px;background:var(--sunk);padding:14px 16px}
.yield-tile .yt-label{font-size:13.5px;color:var(--ink3);margin-bottom:5px;font-weight:600}
.yield-tile .yt-num{font-family:var(--mono);font-weight:700;font-size:22px;color:var(--ink)}
.yield-tile .yt-pct{font-size:13px;color:var(--ink3);margin-top:4px}
.yield-tile .yt-note{font-size:12.5px;color:var(--ink3);margin-top:6px;font-style:italic;line-height:1.4}

.lpr-chart-host{margin:0 0 26px;border:2px solid var(--rule);border-radius:12px;
  background:var(--card);padding:18px 20px 12px}
.lpr-chart-host svg{width:100%;height:auto;display:block}
.lpr-legend{display:flex;gap:20px;margin-bottom:10px;font-size:14px;color:var(--ink2);font-weight:600}
.lpr-legend span{display:inline-flex;align-items:center;gap:7px}
.lpr-legend i{width:12px;height:3px;border-radius:2px;display:inline-block}

.china-compare-box{border:2px solid var(--rule);border-radius:12px;background:var(--card);
  padding:18px 22px;margin-bottom:24px;font-size:17px;color:var(--ink2);font-weight:600;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.china-compare-box b{font-family:var(--mono);font-weight:700;color:var(--ink)}

.china-table-wrap{overflow-x:auto;border:2px solid var(--rule);border-radius:12px;
  background:var(--card);margin-bottom:10px}
table.china-table{width:100%;border-collapse:collapse;font-size:15.5px;min-width:520px}
table.china-table th,table.china-table td{padding:13px 16px;text-align:right;white-space:nowrap}
table.china-table th:first-child,table.china-table td:first-child{text-align:left}
table.china-table thead th{color:var(--ink3);font-weight:600;font-size:14px;
  border-bottom:2px solid var(--rule)}
table.china-table tbody td{font-family:var(--mono);font-weight:700;color:var(--ink);
  border-bottom:1px solid var(--rule-soft)}
table.china-table tbody td:first-child{font-family:var(--ui);font-weight:700}
table.china-table tbody tr:last-child td{border-bottom:none}
.china-asof{font-size:13.5px;color:var(--ink3);margin:10px 2px 26px;font-style:italic}
.panel{scroll-margin-top:76px;border:2px solid var(--rule);border-left-width:7px;
  border-radius:12px;background:var(--card);margin-bottom:22px;overflow:hidden}
.ptop{display:grid;grid-template-columns:1fr auto;gap:24px;padding:24px 26px 18px;align-items:start}
.psym{font-family:var(--mono);font-size:15px;color:var(--ink3);margin:0 0 8px;letter-spacing:.06em}
.pname{font-weight:700;font-size:30px;line-height:1.15;margin:0;letter-spacing:-.02em}
.pname .star{color:var(--crown);font-size:.72em;vertical-align:.12em;margin-left:9px;cursor:default}
.pprice{font-family:var(--mono);font-weight:700;font-size:24px;margin:12px 0 0;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--ink)}
.pprice em{font-style:normal;font-size:15px;color:var(--ink3);font-weight:500}
.live{display:inline-flex;align-items:center;gap:7px;font-family:var(--ui);
  font-size:14px;font-weight:600;color:var(--z2);background:var(--sunk);
  padding:3px 11px;border-radius:20px}
.live i{width:9px;height:9px;border-radius:50%;background:currentColor;animation:beat 2s infinite}
@keyframes beat{0%,100%{opacity:1}50%{opacity:.25}}
.pright{display:flex;align-items:center;gap:20px}
.ppct{text-align:right}
.ppct b{display:block;font-family:var(--mono);font-weight:700;font-size:42px;line-height:1}
.ppct span{display:block;font-size:14.5px;color:var(--ink3);margin-top:6px;font-weight:500}
.disc{min-width:112px;padding:13px 16px;flex-shrink:0;border-radius:12px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;
  font-weight:700;color:#fff;line-height:1.2;text-align:center}
html[data-theme="dark"] .disc{color:#101820}
.disc .act{font-size:19px;letter-spacing:.02em;white-space:nowrap}
.disc:has(.act:only-child) .act{font-size:20px}
.disc .st{font-family:var(--mono);font-size:12px;opacity:.85;margin-top:5px;font-weight:500}
.pmeta{padding:0 26px 18px;display:flex;gap:24px;flex-wrap:wrap;font-size:16.5px;color:var(--ink2)}
.pmeta b{font-family:var(--mono);font-weight:700;color:var(--ink)}
.pchart{position:relative;padding:0 14px 14px}
.pchart svg{width:100%;height:auto;display:block;overflow:visible}
.prof{margin:0 26px 18px;border-top:2px solid var(--rule-soft);padding-top:14px}
.prof summary{font-size:16px;font-weight:600;color:var(--ink2);cursor:pointer;list-style:none}
.prof summary::-webkit-details-marker{display:none}
.prof summary::before{content:'▸ ';color:var(--ink3)}
.prof[open] summary::before{content:'▾ '}
.prof table{width:100%;border-collapse:collapse;margin-top:12px;font-size:15.5px}
.prof td{padding:7px 10px 7px 0;border-bottom:1px solid var(--rule-soft);vertical-align:baseline}
.prof tr:last-child td{border-bottom:none}
.prof .k{font-weight:700;white-space:nowrap}
.prof .n{font-family:var(--mono);color:var(--ink2);white-space:nowrap}
.prof .est{font-family:var(--mono);font-weight:700;color:var(--ink);white-space:nowrap}
.prof .miss{color:var(--ink3)}
.pnote{margin:0;padding:0 26px 20px;font-size:15.5px;color:var(--ink3);line-height:1.6;max-width:74ch}
.pnote-greed{margin:0;padding:0 26px 20px;font-size:15.5px;color:var(--crown);font-weight:600;line-height:1.6;max-width:74ch}

.tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .1s;
  background:var(--tipbg);color:var(--tipfg);border-radius:8px;padding:12px 16px;
  font-family:var(--mono);font-size:15.5px;white-space:nowrap;
  transform:translate(-50%,-118%);z-index:6;line-height:1.6;font-weight:500}
.tip u{text-decoration:none;color:var(--tipac);display:block}
.tip i{font-style:normal;opacity:.65;display:block;font-size:14px}

#top{position:fixed;right:calc(26px + env(safe-area-inset-right));
  bottom:calc(26px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;
  border:2px solid var(--rule);background:var(--card);color:var(--ink2);
  font-size:22px;cursor:pointer;display:none;align-items:center;justify-content:center;
  box-shadow:0 3px 14px rgba(0,0,0,.18);z-index:20}
#top:hover{border-color:var(--ink);color:var(--ink)}
#top.show{display:flex}

footer{border-top:2px solid var(--rule);padding:36px 0 90px;color:var(--ink2);font-size:16.5px}
footer p{max-width:64ch;margin:0 0 14px;line-height:1.65}
footer code{font-family:var(--mono);font-size:15px;color:var(--ink);background:var(--sunk);padding:2px 7px;border-radius:4px}
.copyright{margin-top:24px;font-size:15px;color:var(--ink3)}

@media (max-width:780px){
  body{font-size:16.5px}
  .wrap{padding:0 17px}
  .navbar{margin:0 -17px;padding:9px 17px}
  header{padding:30px 0 26px}
  .ptop{grid-template-columns:1fr;gap:16px}
  .pright{justify-content:space-between}
  .pname{font-size:26px}
  .ppct b{font-size:36px}
  .disc{min-width:98px;padding:11px 13px}
  .disc .act{font-size:17px}
  #top{right:16px;bottom:16px}
}
:focus-visible{outline:3px solid var(--crown);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* 系统开启「增强对比度」时加粗描边 */
@media (prefers-contrast:more){
  .panel,.pill,.chip,#top{border-color:var(--ink)}
  .summary,.pmeta,footer{color:var(--ink)}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <svg class="crown" viewBox="0 0 26 20" aria-hidden="true">
      <path d="M2 17h22M3 15l-1.6-11 6.4 5L13 2l5.2 7 6.4-5L23 15z"
            fill="none" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
    <span class="brand-name" id="brandName">一位比特国王</span>
    <div class="tools">
      <button class="pill mono" id="langBtn" type="button">EN</button>
      <button class="pill" id="themeBtn" type="button" title="">☾</button>
      <button class="pill" id="cbBtn" type="button"></button>
      <button class="pill" id="copyBtn" type="button"></button>
      <a class="pill" href="https://x.com/onebitking" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 2H22l-7 8 8.2 12h-6.4l-5-7.3L5.9 22H2.8l7.5-8.6L2.4 2h6.6l4.5 6.7L18.9 2Zm-1.1 18h1.7L7.3 3.8H5.4L17.8 20Z"/></svg>
        @onebitking
      </a>
    </div>
  </div>

  <nav class="navbar" id="navbar"><div class="navstrip" id="navstrip"></div></nav>

  <header>
    <h1 id="h1"></h1>
    <div class="composite" id="composite" hidden title="">
      <div class="composite-main">
        <span class="composite-label" id="cLabel"></span>
        <b class="composite-num" id="cNum">—</b>
        <span class="composite-meta" id="cMeta"></span>
      </div>
      <div class="composite-spark"><svg id="cSpark" viewBox="0 0 300 64" role="img"></svg></div>
    </div>
    <div class="scale">
      <div class="scale-bar" id="scaleBar"></div>
      <div class="scale-ends"><span id="scaleLo"></span><span id="scaleHi"></span></div>
    </div>
    <div class="notice" id="stale" hidden></div>
    <div class="notice" id="demoBanner" hidden></div>
  </header>

  <section class="band">
    <div class="band-head">
      <h2 id="distTitle"></h2>
      <button class="pill" id="sortBtn" type="button"></button>
    </div>
    <p class="summary" id="summary">—</p>
    <svg id="ribbon" viewBox="0 0 1000 600" role="img"></svg>
  </section>

  <section class="panels" id="panels"></section>

  <section class="band-extra" id="bondSection" hidden>
    <h2 id="bondTitle"></h2>
    <p class="summary" id="bondHint"></p>
    <div class="bond-grid" id="bondGrid"></div>
    <div class="divergence-box" id="divergenceBox" hidden></div>
    <div class="yield-grid" id="yieldGrid"></div>
    <div id="tltPanelHost"></div>
  </section>

  <section class="band-extra" id="chinaSection" hidden>
    <h2 id="chinaTitle"></h2>
    <p class="summary" id="chinaHint"></p>
    <div class="yield-grid" id="lprGrid"></div>
    <div class="lpr-chart-host">
      <div class="lpr-legend" id="lprLegend"></div>
      <svg id="lprChart" viewBox="0 0 1000 260" role="img"></svg>
    </div>
    <div class="china-compare-box" id="chinaCompareBox" hidden></div>
    <div class="china-table-wrap">
      <table class="china-table" id="chinaTable"></table>
    </div>
    <p class="china-asof" id="chinaAsOf"></p>
  </section>

  <section class="band-extra" id="extraSection" hidden>
    <h2 id="extraTitle"></h2>
    <p class="summary" id="extraHint"></p>
    <div class="panels" id="panelsExtra"></div>
  </section>

  <footer id="footer"></footer>
</div>
<button id="top" type="button" aria-label="Top">↑</button>

<script>
const NS='http://www.w3.org/2000/svg';
const el=(t,a={})=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);return n;};
const $=s=>document.querySelector(s);
const V=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const ZC={L1:'--z1',L2:'--z2',L3:'--z3',L4:'--z4'};
const SQ=v=>Math.sqrt(Math.max(0,v));
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const fmt=v=>v>=10?v.toFixed(1):v.toFixed(2);

function money(p,cur){
  if(p==null)return '—';
  const d=p>=1000?0:p>=10?2:4;
  return (SYMS[cur]||'')+p.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
}
function zoneOf(v,tiers){let h=null;for(const t of tiers)if(t.max!=null&&v<=t.max)h=t;return h;}

           [52,'#DCC178'],[65,'#FFB047'],[80,'#FF9A2E'],[100,'#FF8A12']]}
};
const ramp=()=>RAMPS[THEME][CB?'cb':'normal'];
const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
function heat(v){
  const R=ramp();v=Math.max(0,Math.min(100,v));
  for(let i=1;i<R.length;i++){
    if(v<=R[i][0]){
      const [v0,c0]=R[i-1],[v1,c1]=R[i];
      const t=(v-v0)/(v1-v0),a=hex2rgb(c0),b=hex2rgb(c1);
      return `rgb(${a.map((x,k)=>Math.round(x+(b[k]-x)*t)).join(',')})`;
    }
  }
  return R[R.length-1][1];
}

/* ================= 实时价 ================= */
const LIVE={'BTC-USD':'BTC'};
const timers=[],liveTicks=[];
async function fetchLive(code){
  const r=await fetch(`https://api.coinbase.com/v2/prices/${code}-USD/spot`,{cache:'no-store'});
  if(!r.ok)throw 0;
  const p=Number((await r.json())?.data?.amount);
  if(!isFinite(p)||p<=0)throw 0;
  return p;
}
function startLive(symbol,node,currency){
  const code=LIVE[symbol];if(!code||!node)return;
  const tick=async()=>{
    try{node.innerHTML=`${money(await fetchLive(code),currency)}<em>${currency}</em>
      <span class="live"><i></i>${T().live}</span>`;}catch{}
  };
  tick();timers.push(setInterval(tick,30000));liveTicks.push(tick);
}

/* ================= 派生指标 ================= */
function drawdown52(series){
  const last=series[series.length-1];
  if(last.p==null)return null;
  const cut=new Date(last.d);cut.setDate(cut.getDate()-365);
  let hi=0;
  for(let i=series.length-1;i>=0;i--){
    if(new Date(series[i].d)<cut)break;
    if(series[i].p!=null&&series[i].p>hi)hi=series[i].p;
  }
  return hi?(last.p/hi-1)*100:null;
}
function lastInZone(series,l1){
  for(let i=series.length-1;i>=0;i--){
    if(series[i].v<=l1){
      if(i===series.length-1)return {now:true};
      return {date:series[i].d,
        days:Math.round((new Date(series[series.length-1].d)-new Date(series[i].d))/864e5)};
    }
  }
  return null;
}

function demoComposite(assets){

  });

/* 标签防重叠：线画在真实位置，只把文字沿 y 推开。
   dir=-1 向上推（贪婪端，锚定最下面那个），dir=1 向下推（恐慌端，锚定最上面那个）。 */
function spread(ys,minGap,dir){
  const idx=ys.map((y,i)=>[y,i]).sort((a,b)=>dir>0?a[0]-b[0]:b[0]-a[0]);
  const out=new Array(ys.length);
  let last=null;
  for(const [y,i] of idx){
    let ny=y;
    if(last!==null && Math.abs(ny-last)<minGap) ny=last+dir*minGap;
    out[i]=ny;last=ny;
  }
  return out;
}

  svg.appendChild(el('circle',{cx:X(n-1),cy:Y(a.series[n-1].v),r:6,fill:c}));

  [0,Math.floor((n-1)/2),n-1].forEach((i,k)=>{
    const t=el('text',{x:X(i),y:H-8,fill:V('--ink3'),'font-family':V('--mono'),'font-size':13.5,
      'text-anchor':k===0?'start':k===2?'end':'middle'});
    t.textContent=a.series[i].d;svg.appendChild(t);
  });

  const cross=el('line',{x1:0,y1:6,x2:0,y2:FB,stroke:V('--ink'),'stroke-width':1.5,
    opacity:0,'vector-effect':'non-scaling-stroke'});
  svg.appendChild(cross);
  const tip=document.createElement('div');tip.className='tip';
  const move=e=>{
    const r=svg.getBoundingClientRect();
    const cx0=e.touches?e.touches[0].clientX:e.clientX;
    const i=Math.max(0,Math.min(n-1,Math.round(((cx0-r.left)/r.width*W-PL)/(W-PL-PR)*(n-1))));
    const s=a.series[i];
    cross.setAttribute('x1',X(i));cross.setAttribute('x2',X(i));cross.setAttribute('opacity',.4);
    tip.style.opacity=1;tip.style.left=(X(i)/W*100)+'%';tip.style.top=(Y(s.v)/H*100)+'%';
    tip.innerHTML=`${T().pct} ${fmt(s.v)}<u>${money(s.p,a.currency)}</u><i>${s.d}</i>`;
  };
  const out=()=>{cross.setAttribute('opacity',0);tip.style.opacity=0;};
  svg.addEventListener('mousemove',move);
  svg.addEventListener('mouseleave',out);
  svg.addEventListener('touchmove',move,{passive:true});
  svg.addEventListener('touchend',out);

  chart.appendChild(svg);chart.appendChild(tip);box.appendChild(chart);
  // 历史画像
  const rows=profileRows(a,tiers);
  if(rows.some(r=>r.p)){
    const d=document.createElement('details');d.className='prof';
    d.innerHTML=`<summary>${T().profTitle}</summary><table><tbody>${
      rows.map(r=>{
        if(!r.p)return `<tr><td class="k" style="color:${r.color}">${r.label}</td>`
          +`<td class="miss" colspan="2">${T().never}</td></tr>`;
        const mid=`${r.p.episodes} ${T().times} · ${T().lastAt} ${r.p.last}`;
        const right=r.greed
          ? `<span class="n">${T().atHigh}</span>`
          : (r.est!=null?`<span class="est">${money(r.est,a.currency)}</span>`
                         +`<span class="n"> · ${r.p.dd}%</span>`:'—');
        return `<tr><td class="k" style="color:${r.color}">${r.label}</td>`
          +`<td class="n">${mid}</td><td>${right}</td></tr>`;
      }).join('')}</tbody></table>`;
    box.appendChild(d);
  }

  if(a.note&&LANG==='zh'){
    const p=document.createElement('p');p.className='pnote';p.textContent=a.note;box.appendChild(p);
  }
  if(a.greed_confirmed){
    const p=document.createElement('p');p.className='pnote-greed';p.textContent=T().clfNote;box.appendChild(p);
  }
  document.getElementById(containerId).appendChild(box);
  startLive(a.symbol,box.querySelector(`#px-${idx}`),a.currency);

  if(!REDUCED){
    const len=line.getTotalLength();
    line.style.strokeDasharray=len;line.style.strokeDashoffset=len;
    line.style.transition='stroke-dashoffset 1s cubic-bezier(.22,.8,.3,1)';
    line.addEventListener('transitionend',()=>{line.style.strokeDasharray='none';},{once:true});
    setTimeout(()=>{line.style.strokeDashoffset=0;},50+idx*40);
  }
}

/* ================= 吸顶导航 ================= */
function buildNav(list,tiers){
  const strip=$('#navstrip');strip.innerHTML='';
  list.forEach(a=>{
    const c=heat(a.latest.value);
    const el2=document.createElement('a');
    el2.className='chip';el2.href='#'+anchor(a.symbol);
    el2.innerHTML=`<i style="background:${c}"></i>${shortCode(a.symbol)} ${fmt(a.latest.value)}`;
    strip.appendChild(el2);
  });
}

/* ================= 复制概览 ================= */
function summaryText(){
  const tiers=DATA.tiers;
  const core=DATA.assets.filter(a=>!a.display_only);
  const sorted=[...core].sort((a,b)=>a.latest.value-b.latest.value);
  const inZ=sorted.filter(a=>zoneOf(a.latest.value,tiers));
  const head=LANG==='en'
    ? `One Bit King · Fear & Greed Depth · ${core[0]?.latest.date}`
    : `一位比特国王 · 贪婪恐慌深度 · ${core[0]?.latest.date}`;
  const lines=sorted.slice(0,5).map(a=>{
    const z=zoneOf(a.latest.value,tiers);
    return `${nameOf(a)} ${fmt(a.latest.value)}${z?' '+z.key:''}`;
  });
  const tail=LANG==='en'
    ? `${inZ.length}/${core.length} in fear zone`
    : `${core.length} 个标的，${inZ.length} 个在恐慌区`;
  return [head,tail,'',...lines].join('\n');
}

/* ================= 综合指数 ================= */
function renderComposite(d){
  const box=$('#composite'),c=d.composite;
  if(!c){box.hidden=true;return;}
  box.hidden=false;
  const col=heat(c.value);
  box.title=T().compositeHint;
  $('#cLabel').textContent=T().compositeLabel;
  $('#cNum').textContent=fmt(c.value);
  $('#cNum').style.color=col;
  $('#cMeta').textContent=T().compositeMeta(c.date,Math.round(c.weight_covered*100));

  const svg=$('#cSpark');svg.innerHTML='';
  const pts=c.series90||[];
  if(pts.length>1){
    const W=300,H=64,PD=4;
    const vs=pts.map(p=>p.v),lo=Math.min(...vs),hi=Math.max(...vs),sp=(hi-lo)||1;
    const X=i=>PD+i/(pts.length-1)*(W-2*PD);
    const Y=v=>H-PD-(v-lo)/sp*(H-2*PD);
    const d2=pts.map((p,i)=>`${i===0?'M':'L'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');
    svg.appendChild(el('path',{d:d2,fill:'none',stroke:col,'stroke-width':2.6,
      'stroke-linejoin':'round','stroke-linecap':'round','vector-effect':'non-scaling-stroke'}));
    svg.appendChild(el('circle',{cx:X(pts.length-1),cy:Y(pts[pts.length-1].v),r:4,fill:col}));
  }
}

/* ================= 渲染 ================= */
let DATA=null,byFear=true;   // 默认按恐慌程度排序
const coreAssets=()=>DATA.assets.filter(a=>!a.display_only);
const order=()=>{const core=coreAssets();return byFear?core.sort((a,b)=>a.latest.value-b.latest.value):core;};
function draw(){
  timers.splice(0).forEach(clearInterval);liveTicks.length=0;
  const list=order();
  renderComposite(DATA);
  ribbon(DATA,list);
  buildNav(list,DATA.tiers);
  $('#panels').innerHTML='';
  list.forEach((a,i)=>panel(a,DATA.tiers,i));

  // 独立展示标的（如 ^NDX）：同一套 panel() 渲染，单独一节、不进上面的16个标的分布/导航，
  // idx 接着主列表往后编号，避免 SVG 渐变 id（hb0/hb1...）在两节之间撞车。
  // TLT 单独走债市温度那一节（renderBondMarket），不在这里重复出现。
  const extra=DATA.assets.filter(a=>a.display_only&&a.symbol!=='TLT');
  $('#panelsExtra').innerHTML='';
  $('#extraSection').hidden = extra.length===0;
  extra.forEach((a,i)=>panel(a,DATA.tiers,list.length+i,'panelsExtra'));

  renderBondMarket(list.length+extra.length);
  renderChinaRates();
}

/* ================= 债市温度 ================= */
function fmtEpisode(ep){
  const sm=ep.start.slice(0,7),em=ep.end.slice(0,7);
  return sm===em?sm:`${sm}~${em}`;
}
function bondTile(label,valueHtml,subHtml){
  const box=document.createElement('div');box.className='bond-tile';
  box.innerHTML=`<div class="bt-label">${label}</div><div class="bt-num">${valueHtml}</div><div class="bt-sub">${subHtml}</div>`;
  return box;
}
function macroName(key,m){return LANG==='en'?(MACRO_NAME_EN[key]||m.name):m.name;}
function macroNote(key,m){return LANG==='en'?(MACRO_NOTE_EN[key]||''):m.note;}
function renderBondMarket(nextIdx){
  const bm=DATA.bond_market,section=$('#bondSection');
  const tlt=DATA.assets.find(a=>a.symbol==='TLT');
  if(!bm||!tlt){section.hidden=true;return;}
  section.hidden=false;
  const t=T(),macro=bm.macro||{};

  const grid=$('#bondGrid');grid.innerHTML='';
  const yc=macro.yield_curve_2s10s;
  if(yc){
    const col=heat(yc.percentile);
    const statusText=yc.status==='inverted'?t.curveInverted:t.curveNormal;
    grid.appendChild(bondTile(t.yieldCurveLabel,
      `<span style="color:${col}">${fmt(yc.percentile)}</span>`,
      t.curveSub(yc.value,statusText)));
  }
  const cs=macro.credit_spread;
  if(cs){
    const col=heat(cs.percentile);
    grid.appendChild(bondTile(t.creditSpreadLabel,
      `<span style="color:${col}">${fmt(cs.percentile)}</span>`,t.spreadSub(cs.value)));
  }
  const mv=macro.move_index;
  if(mv){
    const col=heat(mv.percentile);
    grid.appendChild(bondTile(t.moveLabel,
      `<span style="color:${col}">${fmt(mv.percentile)}</span>`,t.moveSub(mv.value)));
  }

  const dv=bm.divergence,dbox=$('#divergenceBox');
  if(dv){
    dbox.hidden=false;
    const col=heat(50+dv.value/2); // 温差本身不是0-100分位，仅借热力渐变的中段色调做视觉提示
    const episodes=bm.simultaneous_fear_episodes||[];
    const epHtml=episodes.length
      ? `<div class="dv-episodes">${t.divergenceEpisodes} <b>${episodes.map(fmtEpisode).join(' · ')}</b></div>`
      : `<div class="dv-episodes">${t.divergenceNone}</div>`;
    dbox.innerHTML=`<div class="dv-label">${t.divergenceLabel}</div>
      <div class="dv-num" style="color:${col}">${dv.value>=0?'+':''}${fmt(dv.value)}</div>
      <div class="dv-formula">${t.divergenceFormula(dv.composite,dv.tlt)}</div>
      ${epHtml}`;
  }else{
    dbox.hidden=true;
  }

  const ygrid=$('#yieldGrid');ygrid.innerHTML='';
  ['yield_3m','yield_2y','yield_10y','yield_30y'].forEach(key=>{
    const m=macro[key];if(!m)return;
    const box=document.createElement('div');box.className='yield-tile';
    const note=macroNote(key,m);
    box.innerHTML=`<div class="yt-label">${macroName(key,m)}</div>
      <div class="yt-num">${m.value.toFixed(2)}%</div>
      <div class="yt-pct">${t.yieldPctLabel} ${fmt(m.percentile)}</div>
      ${note?`<div class="yt-note">${note}</div>`:''}`;
    ygrid.appendChild(box);
  });

  $('#tltPanelHost').innerHTML='';
  panel(tlt,DATA.tiers,nextIdx,'tltPanelHost');
}

/* ================= 中国利率 ================= */
function lprStepPath(series,X,Y){
  // 阶梯线：LPR是月度公布的离散值，两次公告之间保持不变，用阶梯比直线连接更准确
  if(!series.length)return '';
  let d=`M${X(series[0].d).toFixed(1)},${Y(series[0].v).toFixed(1)}`;
  for(let i=1;i<series.length;i++){
    d+=`L${X(series[i].d).toFixed(1)},${Y(series[i-1].v).toFixed(1)}`;
    d+=`L${X(series[i].d).toFixed(1)},${Y(series[i].v).toFixed(1)}`;
  }
  return d;
}
function renderChinaRates(){
  const cr=DATA.china_rates,section=$('#chinaSection');
  if(!cr){section.hidden=true;return;}
  section.hidden=false;
  const t=T(),lpr=cr.lpr||{},bankRates=cr.bank_rates;

  const grid=$('#lprGrid');grid.innerHTML='';
  ['lpr_1y','lpr_5y'].forEach(key=>{
    const m=lpr[key];if(!m)return;
    const box=document.createElement('div');box.className='yield-tile';
    const note=macroNote(key,m);
    box.innerHTML=`<div class="yt-label">${macroName(key,m)}</div>
      <div class="yt-num">${m.value.toFixed(2)}%</div>
      ${note?`<div class="yt-note">${note}</div>`:''}`;
    grid.appendChild(box);
  });

  const svg=$('#lprChart');svg.innerHTML='';
  const series1=(lpr.lpr_1y||{}).series||[],series5=(lpr.lpr_5y||{}).series||[];
  const allPts=[...series1,...series5];
  if(allPts.length>1){
    const W=1000,H=260,PL=10,PR=58,PT=16,PB=26;
    const t0=Math.min(...allPts.map(p=>new Date(p.d).getTime()));
    const t1=Math.max(...allPts.map(p=>new Date(p.d).getTime()));
    const vlo=Math.min(...allPts.map(p=>p.v)),vhi=Math.max(...allPts.map(p=>p.v));
    const vpad=(vhi-vlo)*0.1||0.5;
    const X=d=>PL+(new Date(d).getTime()-t0)/((t1-t0)||1)*(W-PL-PR);
    const Y=v=>PT+(1-(v-(vlo-vpad))/(((vhi+vpad)-(vlo-vpad))||1))*(H-PT-PB);

    const c1='#6BD79F',c5='#F5A048';
    [[series1,c1],[series5,c5]].forEach(([series,color])=>{
      if(!series.length)return;
      svg.appendChild(el('path',{d:lprStepPath(series,X,Y),fill:'none',stroke:color,
        'stroke-width':2.4,'stroke-linejoin':'round','vector-effect':'non-scaling-stroke'}));
      const last=series[series.length-1];
      svg.appendChild(el('circle',{cx:X(last.d),cy:Y(last.v),r:4,fill:color}));
      const lab=el('text',{x:W-PR+8,y:Y(last.v)+5,fill:color,
        'font-family':V('--mono'),'font-size':14,'font-weight':700});
      lab.textContent=last.v.toFixed(2)+'%';svg.appendChild(lab);
    });

    const startD=allPts.find(p=>new Date(p.d).getTime()===t0).d;
    const endD=allPts.find(p=>new Date(p.d).getTime()===t1).d;
    [[startD,'start'],[endD,'end']].forEach(([d,anchor])=>{
      const lab=el('text',{x:X(d),y:H-6,fill:V('--ink3'),'font-family':V('--mono'),
        'font-size':13,'text-anchor':anchor});
      lab.textContent=d;svg.appendChild(lab);
    });
  }
  $('#lprLegend').innerHTML=
    `<span><i style="background:#6BD79F"></i>${macroName('lpr_1y',lpr.lpr_1y||{name:'LPR 1年期'})}</span>
     <span><i style="background:#F5A048"></i>${macroName('lpr_5y',lpr.lpr_5y||{name:'LPR 5年期以上'})}</span>`;

  const cbox=$('#chinaCompareBox');
  if(bankRates&&bankRates.banks&&bankRates.banks.length&&DATA.composite){
    cbox.hidden=false;
    cbox.innerHTML=t.chinaCompare(bankRates.banks[0].y1,DATA.composite.value);
  }else{
    cbox.hidden=true;
  }

  const table=$('#chinaTable');
  if(bankRates&&bankRates.banks&&bankRates.banks.length){
    const rows=bankRates.banks.map(b=>{
      const name=LANG==='en'?(BANK_NAME_EN[b.name]||b.name):b.name;
      return `<tr><td>${name}</td><td>${b.demand.toFixed(2)}%</td><td>${b.m3.toFixed(2)}%</td>`
        +`<td>${b.y1.toFixed(2)}%</td><td>${b.y3.toFixed(2)}%</td><td>${b.y5.toFixed(2)}%</td></tr>`;
    }).join('');
    table.innerHTML=`<thead><tr><th>${t.bankCol}</th><th>${t.demandCol}</th><th>${t.m3Col}</th>
      <th>${t.y1Col}</th><th>${t.y3Col}</th><th>${t.y5Col}</th></tr></thead><tbody>${rows}</tbody>`;
    $('#chinaAsOf').textContent=t.chinaAsOf(bankRates.as_of);
  }else{
    table.innerHTML='';
    $('#chinaAsOf').textContent='';
  }
}

function paintChrome(){
  const t=T();
  document.documentElement.lang = LANG==='zh'?'zh-CN':'en';
  document.documentElement.dataset.theme = THEME;
  $('#themeColorMeta').content = THEME==='dark' ? '#101820' : '#EAEEF1';
  $('#brandName').textContent=t.brand;
  $('#h1').innerHTML=t.h1;
  $('#distTitle').textContent=t.dist;
  $('#extraTitle').textContent=t.extraTitle;
  $('#extraHint').textContent=t.extraHint;
  $('#bondTitle').textContent=t.bondTitle;
  $('#bondHint').textContent=t.bondHint;
  $('#chinaTitle').textContent=t.chinaTitle;
  $('#chinaHint').textContent=t.chinaHint;
  $('#sortBtn').textContent=byFear?t.sortOrig:t.sortFear;
  $('#langBtn').textContent=LANG==='zh'?'EN':'中';
  $('#themeBtn').textContent=THEME==='dark'?'☀':'☾';
  $('#cbBtn').textContent=CB?t.cbOn:t.cbOff;
  $('#cbBtn').classList.toggle('on',CB);
  $('#copyBtn').textContent=t.copy;
  const R=ramp();
  $('#scaleBar').style.background=`linear-gradient(90deg,${R.map(([v,c])=>`${c} ${v}%`).join(',')})`;
  $('#scaleLo').textContent=CB?t.scaleLoCB:t.scaleLo;
  $('#scaleLo').style.color=heat(0);
  $('#scaleHi').textContent=CB?t.scaleHiCB:t.scaleHi;
  $('#scaleHi').style.color=heat(100);
  $('#demoBanner').textContent=t.demo;
  $('#footer').innerHTML=t.foot.map(p=>`<p>${p}</p>`).join('')
    +`<p class="copyright">${t.copyright}</p>`;
  if(DATA&&!DATA.demo){
    const last=DATA.assets[0]?.latest.date;
    const days=last?Math.floor((Date.now()-new Date(last+'T00:00:00'))/864e5):0;
    $('#stale').hidden = days<=4;
    if(days>4)$('#stale').textContent=t.stale(last,days);
  }
}
function render(d){
  DATA=d;
  $('#demoBanner').hidden=!d.demo;
  paintChrome();
  draw();
}

$('#langBtn').onclick=()=>{LANG=LANG==='zh'?'en':'zh';paintChrome();draw();};
$('#themeBtn').onclick=()=>{THEME=THEME==='dark'?'light':'dark';paintChrome();draw();};
$('#cbBtn').onclick=()=>{CB=!CB;paintChrome();draw();};
$('#sortBtn').onclick=()=>{byFear=!byFear;paintChrome();draw();};
$('#copyBtn').onclick=async()=>{
  const text=summaryText(), b=$('#copyBtn');
  // iPhone/iPad 上直接调系统分享面板，比复制到剪贴板顺手
  if(navigator.share){
    try{ await navigator.share({title:T().brand,text}); return; }catch{ /* 用户取消就当没点 */ }
  }
  try{
    await navigator.clipboard.writeText(text);
    b.textContent=T().copied;
    setTimeout(()=>{b.textContent=T().copy;},1600);
  }catch{}
};
$('#top').onclick=()=>window.scrollTo({top:0,behavior:REDUCED?'auto':'smooth'});

// iOS 会冻结后台标签页的定时器，切回来时手动补一次
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden) liveTicks.forEach(f=>f());
});
addEventListener('scroll',()=>{
  $('#top').classList.toggle('show',scrollY>600);
  $('#navbar').classList.toggle('show',scrollY>420);
},{passive:true});

fetch('dashboard_data.json',{cache:'no-store'})
  .then(r=>{if(!r.ok)throw 0;return r.json();})
  .then(render).catch(()=>render(demo()));
</script>
